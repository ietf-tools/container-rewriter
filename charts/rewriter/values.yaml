secret_db:
  create: false
  name: db-app
  data:
    dbname: postfix
    host: dbserver
    port: 5432
    username: rewriter
    password: rewriter

rewriter:
  forwardingAddr: forwardingalgorithm@myaddr.com
  forwardingDomain: myaddr.com
  listeningPort: 8800
  mailmanSaslUser: mailman@ietf.org
  ignoreList: support@example.com
  localDomains:
    - myaddr.com
  rewriteDomains:
    lists.myaddr.com: dmarc.myaddr.com
  # DKIM2 (see DKIM2.md); everything here is off by default
  dkim2:
    # authserv-id for Authentication-Results; set it to turn on verification
    # of arriving mail. Use the name rspamd already reports under,
    # e.g. mail.ietf.org
    authservId: ""
    # selector to sign with: the key is <selector>.key in each domain's
    # Secret. Empty means the newest (last by name) .key file is used
    selector: ""
    # one entry per signing domain; any entry turns on signing. Each Secret
    # holds one or more <selector>.key items (PEM private keys). A domain's
    # key also signs for its subdomains (ietf.org covers dmarc.ietf.org)
    keys: []
    #  - domain: ietf.org
    #    existingSecretName: rewriter-dkim2-ietf-org
    # split then sign: the milter_macro_daemon_name of the Postfix listener
    # that sends each off-site copy back, one recipient at a time, to be
    # signed (Postfix's dkim2Split). Only that listener's mail is signed;
    # empty signs in the transaction that relays the mail off-site
    signDaemon: ""
    # with signDaemon: give each list copy mailman's VERP envelope sender
    # (<list>-bounces+<local>=<domain>@), so bounces name the subscriber
    listVerp: false
  # only the Postfix pods may reach the milter port (the signing pass is
  # chosen by a macro the milter client sends); the health port stays open
  # to the kubelet
  networkPolicy:
    enabled: false
    milterFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postfix
  database:
    host:
      existingSecretName: db-app
      existingSecretKey: host
    user:
      existingSecretName: db-app
      existingSecretKey: username
    db_name:
      existingSecretName: db-app
      existingSecretKey: dbname
    password:
      existingSecretName: db-app
      existingSecretKey: password
# This sets the type of deployment, either DaemonSet or Deployment
deployKind: Deployment
# If deployKind: Deployment
# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/ietf-tools/container-rewriter

  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  #tag: "v1.1.0"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# fsGroup makes mounted volumes (the DKIM2 key Secrets) readable by the
# rewriter user's group. It applies to the whole pod, filebeat included
podSecurityContext:
  fsGroup: 10001

# the rewriter container only: filebeat keeps its image's own user
securityContext:
  privileged: false
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  annotations: {}


# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 5

dnsPolicy: ""

dnsConfig: {}

nodeSelector: {}

tolerations: []

affinity: {}

filebeat:
  enabled: false
  filebeatVersion: 9.3.3
  tlsCA: false
  logstashHost: 127.0.0.1
  logstashPort: 5044
  loggingHostname: my-rewriter
  logstashTags:
    - rewriter
    - k8s
  filePaths:
    - /var/log/rewrite.log

