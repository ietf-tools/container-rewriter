apiVersion: apps/v1
kind: {{ .Values.deployKind }}
metadata:
  name: {{ include "rewriter.fullname" . }}
  labels:
    {{- include "rewriter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rewriter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rewriter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FORWARDING_ADDR
              value: {{ .Values.rewriter.forwardingAddr }}
            - name: FORWARDING_DOMAIN
              value: {{ .Values.rewriter.forwardingDomain }}
            - name: LOCAL_DOMAINS
              value: "{{ .Values.rewriter.localDomains | join " " }}"
            - name: REWRITE_DOMAINS
              value: {{ .Values.rewriter.rewriteDomains }}
            - name: MAILMAN_SASL_USER
              value: {{ .Values.rewriter.mailmanSaslUser }}
            - name: IGNORELIST
              value: {{ .Values.rewriter.ignoreList }}
            {{- if .Values.rewriter.aliasDkim2 }}
            - name: ALIAS_DKIM2
              value: "yes"
            {{- end }}
            {{- with .Values.rewriter.dkim2 }}
            {{- if .authservId }}
            - name: DKIM2_AUTHSERV_ID
              value: {{ .authservId | quote }}
            {{- end }}
            {{- if .keys }}
            - name: DKIM2_KEYDIR
              value: /etc/dkim2/keys
            {{- if .selector }}
            - name: DKIM2_SELECTOR
              value: {{ .selector | quote }}
            {{- end }}
            {{- end }}
            {{- if .signDaemon }}
            - name: DKIM2_SIGN_DAEMON
              value: {{ .signDaemon | quote }}
            {{- end }}
            {{- if .listVerp }}
            - name: LIST_VERP
              value: "yes"
            {{- end }}
            {{- end }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.rewriter.database.host.existingSecretName . }}
                  key: {{ tpl .Values.rewriter.database.host.existingSecretKey . }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.rewriter.database.db_name.existingSecretName . }}
                  key: {{ tpl .Values.rewriter.database.db_name.existingSecretKey . }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.rewriter.database.user.existingSecretName . }}
                  key: {{ tpl .Values.rewriter.database.user.existingSecretKey . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.rewriter.database.password.existingSecretName . }}
                  key: {{ tpl .Values.rewriter.database.password.existingSecretKey . }}
          ports:
            - containerPort: {{ .Values.rewriter.listeningPort }}
              protocol: TCP
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: logs
              mountPath: /var/log
            {{- range $i, $k := .Values.rewriter.dkim2.keys }}
            - name: dkim2-key-{{ $i }}
              mountPath: /etc/dkim2/keys/{{ required "rewriter.dkim2.keys[].domain is required" $k.domain | lower }}
              readOnly: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.filebeat.enabled }}
      initContainers:
      - name: filebeat
        image: elastic/filebeat:{{ .Values.filebeat.filebeatVersion }}
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        args:
          - -c
          - /etc/filebeat.yml
          - -e
        volumeMounts:
          - name: logs
            mountPath: /var/log
          - name: filebeat-config
            mountPath: /etc/filebeat.yml
            subPath: filebeat.yml
            readOnly: true
          {{- if .Values.filebeat.tlsCA }}
          - name: filebeat-ca
            mountPath: /etc/filebeat/ca.pem
            subPath: ca.pem
            readOnly: true
          {{- end }}
      {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- range $i, $k := .Values.rewriter.dkim2.keys }}
        - name: dkim2-key-{{ $i }}
          secret:
            secretName: {{ required "rewriter.dkim2.keys[].existingSecretName is required" $k.existingSecretName }}
            # owner root, group fsGroup: the rewriter reads them as a group member
            defaultMode: 0440
        {{- end }}
        {{- if .Values.filebeat.enabled }}
        - name: filebeat-config
          configMap:
            name: {{ include "rewriter.fullname" . }}-filebeat-config
            defaultMode: 0444
        {{- if .Values.filebeat.tlsCA }}
        - name: filebeat-ca
          configMap:
            name: {{ include "rewriter.fullname" . }}-filebeat-ca
            defaultMode: 0444
        {{- end }}
        {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

